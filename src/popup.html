<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网页二维码</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main class="popup">
    <header class="header">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div><p class="eyebrow">QRCoder</p><h1>网页二维码</h1></div>
      <span class="local-badge"><span aria-hidden="true">●</span> 本地生成</span>
    </header>

    <section class="page-card" aria-labelledby="page-heading">
      <div class="page-icon" aria-hidden="true">↗</div>
      <div class="page-info"><h2 id="page-heading">当前页面</h2><p id="page-url" title="正在获取页面地址">正在获取页面地址…</p></div>
    </section>

    <section class="preview-section" aria-labelledby="preview-heading">
      <div class="section-heading"><h2 id="preview-heading">二维码预览</h2><span>预览当前样式</span></div>
      <div class="preview-frame">
        <img id="preview" alt="当前网页的二维码" hidden>
        <div id="placeholder" class="placeholder" aria-hidden="true"><div class="placeholder-icon">▦</div><span>正在准备二维码…</span></div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">正在读取当前页面…</p>
    </section>

    <section class="settings" aria-labelledby="settings-heading">
      <div class="section-heading"><h2 id="settings-heading">自定义样式</h2><span>实时更新</span></div>
      <div class="color-grid">
        <label class="color-control"><span>前景色</span><span class="color-value"><input id="dark" type="color" value="#17263b" aria-label="前景色"><output id="dark-value" for="dark">#17263B</output></span></label>
        <label class="color-control"><span>背景色</span><span class="color-value"><input id="light" type="color" value="#ffffff" aria-label="背景色"><output id="light-value" for="light">#FFFFFF</output></span></label>
      </div>
      <div class="range-control"><label for="size">图片尺寸</label><output id="size-value" for="size">512 px</output><input id="size" type="range" min="256" max="1024" step="64" value="512"></div>
      <div class="range-control"><label for="margin">周围留白</label><output id="margin-value" for="margin">4 格</output><input id="margin" type="range" min="0" max="10" step="1" value="4"></div>
    </section>
    <button id="download" class="download" type="button" disabled><span aria-hidden="true">↓</span> 下载 PNG 图片</button>
    <p class="footer">二维码在本地生成，页面地址不会上传</p>
  </main>
</body>
</html>
